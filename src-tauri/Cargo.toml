[package]
name = "ubermensch"
version = "0.6.1"
description = "A keyboard-first Gmail client for macOS"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "ubermensch"

[lib]
name = "ubermensch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ubermensch"
path = "src/main.rs"

[[bin]]
name = "e2e-server"
path = "src/bin/e2e_server.rs"
required-features = ["fake"]

[[bin]]
name = "perf-fixture"
path = "src/bin/perf_fixture.rs"
required-features = ["fake"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
ub-core = { path = "crates/ub-core" }
ub-bridge = { path = "crates/ub-bridge" }
ub-ipc = { path = "crates/ub-ipc" }
ub-domain = { path = "crates/ub-domain" }
ub-gmail = { path = "crates/ub-gmail" }
ub-testkit = { path = "crates/ub-testkit", optional = true }
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
# Debug only: the web bridge on 127.0.0.1:1430 (UBERMENSCH_WEB_BRIDGE=1), for
# the UI in a browser. Release builds leave it off.
web = ["ub-bridge/web"]
# Debug only: the E2E server (`e2e-server`), demo mode (UBERMENSCH_FAKE=1),
# against an in-process fake Gmail, and the perf fixture (`perf-fixture`).
fake = ["web", "dep:ub-testkit", "dep:tokio"]

[lints]
workspace = true

[workspace.package]
# An application, not a library: its minimum Rust is the pinned toolchain.
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace]
members = [
    ".",
    "crates/ub-domain",
    "crates/ub-mime",
    "crates/ub-gmail",
    "crates/ub-store",
    "crates/ub-core",
    "crates/ub-ipc",
    "crates/ub-bridge",
    "crates/ub-testkit",
    "crates/ub-fake-gmail",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.rustdoc]
# Doc warnings fail `cargo doc` (the `lint:rust` task).
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that do not fit an application crate:
# - `#[must_use]` on every getter adds noise; real must-use types are marked;
must_use_candidate = "allow"
# - errors are typed per crate and documented on the enum, and nothing here is a published API;
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# - every hash map and set uses the default hasher; generic hashers would only add type noise.
implicit_hasher = "allow"
# Restriction lints worth having in production code.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Exceptions are `#[expect(lint, reason = "...")]`, so a stale one is reported.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# A guard held through a `match` or `if let` body is a deadlock waiting to happen.
significant_drop_in_scrutinee = "warn"
# Keep the cause when mapping errors.
map_err_ignore = "warn"
# Numeric conversions are explicit (`From` / `try_from`), never `as`.
as_conversions = "warn"
# Panics only in tests (clippy.toml allows them there).
expect_used = "warn"
unwrap_in_result = "warn"
# An Arc clone reads as `Arc::clone(&x)`, never like a deep copy.
clone_on_ref_ptr = "warn"
needless_pass_by_ref_mut = "warn"
